<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>GoRSS Reader</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
  {{ template "content" . }}

  <script>
    // Highlight the current feed in the sidebar.
    (function () {
      var list = document.getElementById("feed-list");
      if (!list) return;

      function setActive(item) {
        list.querySelectorAll(".feed-item.active").forEach(function (el) {
          el.classList.remove("active");
        });
        if (item) item.classList.add("active");
      }

      list.addEventListener("click", function (e) {
        var link = e.target.closest(".feed-item > a");
        if (link) setActive(link.parentElement);
      });

      var current = list.querySelector('.feed-item > a[href="' + location.pathname + '"]');
      setActive(current ? current.parentElement : list.querySelector(".feed-item"));
    })();
  </script>
</body>
</html>
